name: Deploy to Cloudflare Pages
# Direct upload via wrangler: does not count against the 500 builds/month limit of Git-integrated Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update NDBC buoy observations
      - Update satellite water clarity (Kd490)
    types: [completed]
    branches: [main]
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage site files
        run: |
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude '.git' --exclude '.github' --exclude 'dist' \
            --exclude 'scripts' --exclude 'store' --exclude '*.md'
          du -sh dist && find dist -type f | wc -l
      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create reefgo --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy dist --project-name=reefgo --branch=main --commit-dirty=true
